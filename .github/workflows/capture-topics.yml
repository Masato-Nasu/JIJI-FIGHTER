name: Refresh Japanese gameplay screenshot

on:
  push:
    paths:
      - scripts/capture-topics.mjs
      - .github/workflows/capture-topics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real game canvas with demo Japanese words
        run: node scripts/capture-topics.mjs
      - name: Commit updated screenshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/japanese-topics.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: Show more word enemies in gameplay screenshot"
            git push
          fi
