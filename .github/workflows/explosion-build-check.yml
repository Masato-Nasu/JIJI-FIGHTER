name: Validate game build and BGM
on:
  push:
    paths:
      - build.mjs
      - scripts/test-music.mjs
      - scripts/test-recorded-audio.mjs
      - scripts/test-sfx-recording.mjs
      - scripts/test-lethal-projectiles.mjs
      - sw.js
      - .github/workflows/explosion-build-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build with original BGM and crash animation
        run: node build.mjs
      - name: Validate patched game and PWA
        run: |
          node --input-type=module -e "
          import {readFile} from 'node:fs/promises';
          const html=await readFile('dist/index.html','utf8');
          const must=['const DESTRUCTION_SECONDS=2.4;',
            'WALL COLLISION', 'AIRCRAFT DESTROYED',
            'for(let i=0;i<90;i++){',
            \"wallWarning.classList.remove('visible')\",
            'function drawDestruction()'];
          for(const x of must)if(!html.includes(x))throw Error('Missing: '+x);
          console.log('Explosion animation, collision text and warning reset present.');
          "
          test -s dist/music/mazz-db-2017.mp3
          test -s dist/manifest.webmanifest
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play BGM in desktop and mobile browsers
        run: node scripts/test-music.mjs
      - name: Verify lethal enemy shots trigger visible explosion on phones and PCs
        run: node scripts/test-lethal-projectiles.mjs
      - name: Install audio analyzer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Decode saved recordings and verify audible BGM
        run: node scripts/test-recorded-audio.mjs
      - name: Confirm SFX in desktop and mobile saved videos
        run: node scripts/test-sfx-recording.mjs
