name: Validate game build and BGM
on:
  push:
    paths:
      - build.mjs
      - mp4-share.js
      - linux-recording-export.mjs
      - linux-server.mjs
      - start-linux.sh
      - start-linux-chrome.sh
      - linux-music-recovery.js
      - scripts/test-local-linux-recording.mjs
      - scripts/test-music.mjs
      - scripts/test-recorded-audio.mjs
      - scripts/test-sfx-recording.mjs
      - scripts/test-lethal-projectiles.mjs
      - encoder/**
      - scripts/test-recording-upgrade.mjs
      - sw.js
      - .github/workflows/explosion-build-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JIJI_TEST_OUTPUT: .test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build with original BGM and crash animation
        run: node build.mjs
      - name: Validate patched game and PWA
        run: |
          node --input-type=module -e "
          import {readFile} from 'node:fs/promises';
          const html=await readFile('dist/index.html','utf8');
          const must=['const DESTRUCTION_SECONDS=2.4;',
            'WALL COLLISION', 'AIRCRAFT DESTROYED',
            'for(let i=0;i<90;i++){',
            \"wallWarning.classList.remove('visible')\",
            'function drawDestruction()'];
          for(const x of must)if(!html.includes(x))throw Error('Missing: '+x);
          console.log('Explosion animation, collision text and warning reset present.');
          "
          test -s dist/music/mazz-db-2017.mp3
          test -s dist/manifest.webmanifest
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium chrome
      - name: Play BGM in desktop and mobile browsers
        run: node scripts/test-music.mjs
      - name: Verify lethal enemy shots trigger visible explosion on phones and PCs
        run: node scripts/test-lethal-projectiles.mjs
      - name: Install audio analyzer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify actual Linux server and FFmpeg H.264/AAC output
        run: node scripts/test-local-linux-recording.mjs
      - name: Decode saved recordings and verify audible BGM
        run: node scripts/test-recorded-audio.mjs
      - name: Confirm SFX in desktop and mobile saved videos
        run: node scripts/test-sfx-recording.mjs
      - name: Verify public static hosting without a local export API
        run: JIJI_WEB_EXPORT=1 node scripts/test-recorded-audio.mjs
      - name: Verify browser-only SFX and BGM conversion
        run: JIJI_WEB_EXPORT=1 node scripts/test-sfx-recording.mjs
      - name: Verify old PWA cache upgrade, queued failures, and recovery
        run: node scripts/test-recording-upgrade.mjs
      - name: Test installed Google Chrome local music and recording
        env:
          JIJI_CHROME_CHANNEL: chrome
        run: |
          google-chrome --version
          node scripts/test-local-linux-recording.mjs
          node scripts/test-recorded-audio.mjs
      - name: Test installed Google Chrome static-web MP4 and SFX
        env:
          JIJI_CHROME_CHANNEL: chrome
          JIJI_WEB_EXPORT: '1'
        run: |
          node scripts/test-recorded-audio.mjs
          node scripts/test-sfx-recording.mjs
      - name: Retain actual saved recordings for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-validation
          path: .test-artifacts/
          retention-days: 7
          include-hidden-files: true
